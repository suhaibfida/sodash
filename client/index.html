<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sodash - Solana Dashboard</title>
    <script>
      window.__showBootError = function (message) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;background:#030712;color:#fff;font-family:Inter,system-ui,sans-serif;padding:32px">' +
          '<div style="max-width:760px;border:1px solid rgba(248,113,113,.35);background:rgba(127,29,29,.18);border-radius:8px;padding:24px">' +
          '<p style="margin:0 0 8px;color:#fca5a5;font-size:13px;font-weight:700;text-transform:uppercase">Boot error</p>' +
          '<h1 style="margin:0 0 16px;font-size:28px">Sodash could not start</h1>' +
          '<pre style="white-space:pre-wrap;overflow:auto;background:#020617;border-radius:6px;padding:16px;color:#fee2e2">' +
          String(message).replace(/[<>&]/g, function (char) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[char];
          }) +
          "</pre></div></div>";
      };
      window.addEventListener("error", function (event) {
        window.__showBootError(event.message || "Unknown script error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        window.__showBootError(event.reason && event.reason.message ? event.reason.message : event.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
